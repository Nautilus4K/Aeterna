<button class="navbar_toggler" id="navbar_toggler", onclick="toggle_navbar()"><span class="material-icons-outlined">menu</span></button>

<div class="navbar" id="navbar">
    <a id="logo-link" class="logo-link" href="/">
        <img src="/img/favicon.svg">
        <p>AETERNA</p>
    </a>

    <a href="/">{{ locale.homepage }}</a>

    <a href="/novels">{{ locale.novelpage }}</a>

    <a href="/docs">{{ locale.docpage }}</a>
    
    <div class="divider"></div>

    <div class="lang_toggler_container">
        <button onclick="switch_lang()" id="lang_toggler">EN</button>
        <p class="tooltip">{{ locale.tooltip_lang_toggle }}</p>
    </div>

    <button onclick="switch_mode()">
        <span class="material-icons-outlined" id="mode-indicator">
            light_mode
        </span>
    </button>
    
    <button onclick="user_menu()" data-mode="{{ usermenu_mode }}" class="usermenu_btn" id="usermenu_btn">
        {{ user_pfp_button | safe }}
    </button>

    <div class="usermenu hidden" id="usermenu">
        <a href="/logout">Log out</a>
    </div>
</div>
